# =============================================================================
# Synthetic Data Generation Pipeline Configuration
# =============================================================================

# LLM settings
llm:
  model: "gpt-4o-mini"
  temperature: 0.7

# Sample Generation Settings
generation:
  # Total samples per question type (direct/sequential/parallel)
  num_per_type: 500
  
  # Batch size per API call (larger = fewer API calls, but may hit token limits)
  # Recommended: 20-50 for gpt-4o-mini
  batch_size: 50
  
  # Question types: ["direct", "sequential", "parallel"] or "all"
  question_types: "all"
  
  # Output file path
  output: "output/generated_samples.json"
  
  include_templates: true
  include_few_shots: false  # Skip to reduce file size

# Entity source: "mesh" (from MeSH data) or "manual"
entity_source: "mesh"

# MeSH Entity Extraction Settings
# Total available: 22,216 entities
mesh_entities:
  entity_counts:
    diseases: 1000             # from 4,911 available
    chemicals_drugs: 1000      # from 10,277 available
    anatomy: 500               # from 1,857 available
    phenomena_processes: 500   # from 2,358 available
    techniques_equipment: 200  # from 3,018 available
    organisms: 25              # from 29 available
    genes: 300                 # filtered from D
    proteins: 300              # filtered from D
    symptoms: 300              # filtered from C
    drugs: 300                 # filtered from D
  
  default_entity_count: 300

# Manual entities (when entity_source is "manual")
entities:
  diseases:
    - "Gaucher disease"
    - "Fabry disease"
    - "Parkinson's disease"
  genes:
    - "GBA"
    - "GLA"
    - "SNCA"
