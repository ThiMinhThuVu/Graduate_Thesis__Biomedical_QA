run:
  dataset: "medhop" #"wiki"
  question_type: "bridge_comparison"
  threads: [0, 1]
  data_split: "test"
  
dataset:
  wiki: 
    test: "data/raw/wiki/test.json"
    # dev: "data/raw/wiki/dev/dev_{question_type}.json"
    # test: "data/raw/wiki/test/test_{question_type}.json"
    # train: "data/raw/wiki/train/train__{question_type}.json"
  
  medhop:
    test: "data/raw/medhop/test.json"

classification:
  wiki: 
    model_path: "classification/model/wiki/bert_classifier.pth"
    tokenizer_dir: "classification/model/wiki/tokenizer"

  medhop: 
    model_path: "classification/model/medhop/biobert_classifier.pth"
    tokenizer_dir: "classification/model/medhop/seq_tokenizer"

output_path:
  # templates use placeholders {sample_id} and {run}; replace with real values in code
  gg_search: "{retrieval}/step_2_gg_{sample_id}.json"
  wiki_search: "{retrieval}/step_2_wiki_{sample_id}.json"
  wiki_crawl: "{retrieval}/step_2_crawl_wiki_{sample_id}.json"
  paragraphs: "{retrieval}/step_2_paragraphs_{sample_id}.json"
  inf_cache: "{retrieval}/inf_cache_{sample_id}.json"
  qi_answer: "{results}/{run}_step_3b_ans_{sample_id}.json"
  final_answer: "{all_ans}/{run}_step_3b_all_ans_{sample_id}.json"
  evidence: "{evidence}/{run}_evidence_{sample_id}.json"
  ans_old: "{all_ans}/R11_step_3b_all_ans_{sample_id}.json"

type_run:
