run:
  dataset: "wiki" #"medhop" #"wiki"
  question_type: "inference"
  threads: [0, 2]
  data_split: "test"
  
dataset:
  wiki: 
    # test: "data/raw/wiki/test.json"
    # dev: "data/raw/wiki/dev/dev_{question_type}.json"
    test: "data/raw/wiki/test/test_compositional.json"
    # train: "data/raw/wiki/train/train__{question_type}.json"
  
  medhop:
    test: "data/raw/medhop/test.json"

classification:
  wiki: 
    model_path: "classification/model/wiki/bert_classifier.pth"
    tokenizer_dir: "classification/model/wiki/tokenizer"

  medhop: 
    model_path: "classification/model/medhop/biobert_classifier.pth"
    tokenizer_dir: "classification/model/medhop/seq_tokenizer"

