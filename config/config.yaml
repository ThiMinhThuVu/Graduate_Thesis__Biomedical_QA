run:
  dataset: "medhop" #"medhop" #"wiki"
  threads: [7, 10]
  data_split: "test"

type_run: {
      "dataset": "{dataset}_", 
      "get_gg": "True", #True
      "get_wiki": "True",
      "get_abs_wiki": "False", #chỉ chọn 1 trong 2: get_abs_wiki | get_wiki
      "get_crawl_wiki": "True",      
      "get_context_2wiki": "False",
      "get_sparql_context": "True",
      "get_history_old_id": "False", # only True with 2wiki
      "sparql_r_topk": 3, # wiki nên dùng 1-2, medhop: 3
      "sparql_r_retry_topk": 5, # wiki 3 là đủ dùng;  medhop:5
      "run": "R4", # TỰ ĐẶT RUN ĐỂ LƯU FILE
    }


# R1: get_gg
# R2: get_sparql_context
# R3: get_gg, get_wiki, get_crawl_wiki
# R4: get_gg, get_wiki, get_crawl_wiki, get_sparql_context
dataset:
  wiki: 
    # test: "data/raw/wiki/test.json"
    # dev: "data/raw/wiki/dev/dev_{question_type}.json"
    test: "data/raw/wiki/test/test_compositional.json"
    # train: "data/raw/wiki/train/train__{question_type}.json"
  
  medhop:
    test: "data/raw/medhop/test.json"

classification:
  wiki: 
    model_path: "classification/model/wiki/bert_classifier.pth"
    tokenizer_dir: "classification/model/wiki/tokenizer"

  medhop: 
    model_path: "classification/model/medhop/biobert_classifier.pth"
    tokenizer_dir: "classification/model/medhop/seq_tokenizer"

